<svg xmlns="http://www.w3.org/2000/svg" viewBox="125 115 270 315">
  <defs>
    <linearGradient id="basket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9A45F"/>
      <stop offset="1" stop-color="#A96B2E"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D9B5E"/>
      <stop offset="1" stop-color="#0B5636"/>
    </linearGradient>
  </defs>
  <!-- transparent background -->
  <!-- leaves behind the flowers -->
  <g stroke="#0B5636" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M174 226 C126 194 130 151 178 165 C205 178 205 205 174 226Z" fill="url(#leaf)"/>
    <path d="M224 207 C197 151 221 118 253 148 C269 173 254 197 224 207Z" fill="#2F8A4C"/>
    <path d="M287 211 C291 158 328 143 346 177 C350 200 321 216 287 211Z" fill="url(#leaf)"/>
    <path d="M329 230 C355 189 393 201 385 232 C371 251 348 247 329 230Z" fill="#2F8A4C"/>
    <path d="M198 239 C177 210 190 184 216 198 C230 215 219 234 198 239Z" fill="#58A85B"/>
  </g>
  <!-- basket handle -->
  <path d="M174 287 C184 206 329 206 340 287" fill="none" stroke="#8E5529" stroke-width="19" stroke-linecap="round"/>
  <path d="M177 286 C190 218 323 218 337 286" fill="none" stroke="#E2B778" stroke-width="8" stroke-linecap="round"/>
  <!-- flowers -->
  <g transform="translate(183 205)">
    <g fill="#F28A22">
      <ellipse cx="0" cy="-19" rx="11" ry="18"/><ellipse cx="18" cy="-6" rx="11" ry="18" transform="rotate(55 18 -6)"/>
      <ellipse cx="12" cy="15" rx="11" ry="18" transform="rotate(120 12 15)"/><ellipse cx="-11" cy="15" rx="11" ry="18" transform="rotate(165 -11 15)"/>
      <ellipse cx="-19" cy="-5" rx="11" ry="18" transform="rotate(35 -19 -5)"/>
    </g><circle r="10" fill="#6D3C1E"/>
  </g>
  <g transform="translate(251 180)">
    <g fill="#FFF8E8" stroke="#E9DCC6" stroke-width="2">
      <ellipse cx="0" cy="-20" rx="10" ry="17"/><ellipse cx="19" cy="-6" rx="10" ry="17" transform="rotate(55 19 -6)"/>
      <ellipse cx="12" cy="16" rx="10" ry="17" transform="rotate(120 12 16)"/><ellipse cx="-12" cy="16" rx="10" ry="17" transform="rotate(165 -12 16)"/>
      <ellipse cx="-19" cy="-6" rx="10" ry="17" transform="rotate(35 -19 -6)"/>
    </g><circle r="9" fill="#F4B82C"/>
  </g>
  <g transform="translate(316 210)">
    <g fill="#F6B52B">
      <ellipse cx="0" cy="-17" rx="10" ry="16"/><ellipse cx="17" cy="-5" rx="10" ry="16" transform="rotate(55 17 -5)"/>
      <ellipse cx="10" cy="14" rx="10" ry="16" transform="rotate(120 10 14)"/><ellipse cx="-10" cy="14" rx="10" ry="16" transform="rotate(165 -10 14)"/>
      <ellipse cx="-17" cy="-5" rx="10" ry="16" transform="rotate(35 -17 -5)"/>
    </g><circle r="8" fill="#9A4B20"/>
  </g>
  <g transform="translate(220 236)">
    <g fill="#E95749">
      <ellipse cx="0" cy="-13" rx="8" ry="13"/><ellipse cx="13" cy="-4" rx="8" ry="13" transform="rotate(55 13 -4)"/>
      <ellipse cx="8" cy="11" rx="8" ry="13" transform="rotate(120 8 11)"/><ellipse cx="-8" cy="11" rx="8" ry="13" transform="rotate(165 -8 11)"/>
      <ellipse cx="-13" cy="-4" rx="8" ry="13" transform="rotate(35 -13 -4)"/>
    </g><circle r="6" fill="#F8C84A"/>
  </g>
  <!-- basket body -->
  <path d="M147 277 Q256 304 365 277 L342 388 Q256 426 170 388Z" fill="url(#basket)" stroke="#8E5529" stroke-width="7" stroke-linejoin="round"/>
  <!-- woven horizontal bands -->
  <path d="M158 310 Q256 336 354 310 M164 340 Q256 365 348 340 M169 370 Q256 395 343 370" fill="none" stroke="#F0C58A" stroke-width="9" stroke-linecap="round"/>
  <!-- woven vertical strands -->
  <path d="M188 294 L202 400 M224 302 L230 409 M260 305 L260 412 M296 302 L290 409 M332 294 L318 400" fill="none" stroke="#8E5529" stroke-width="7" stroke-linecap="round" opacity=".75"/>
  <!-- top rim -->
  <path d="M145 277 Q256 307 367 277 L363 295 Q256 325 149 295Z" fill="#C68A45" stroke="#8E5529" stroke-width="5" stroke-linejoin="round"/>
  <path d="M154 282 Q256 309 358 282" fill="none" stroke="#F4D39C" stroke-width="5" stroke-linecap="round"/>
</svg>